<!DOCTYPE html>
<html>
<head>
	<title>Pick A Card</title>
	<meta name = "viewport" content = "user-scalable=no, width=device-width">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">
	<link rel="icon" sizes="192x192" href="image/cards.jpg">
	<link rel="manifest" href="manifest.json">
	<script src="https://code.jquery.com/jquery-1.12.4.min.js" integrity="sha256-ZosEbRLbNQzLpnKIkEdrPv7lOy9C27hHQ+Xp8a4MxAQ=" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/gh/nnattawat/flip@v1.0.11/dist/jquery.flip.min.js"></script>
	<script src="https://cdn.jsdelivr.net/gh/mattbryson/TouchSwipe-Jquery-Plugin@refs/heads/master/jquery.touchSwipe.min.js"></script>
	<style>
		html {margin: 0; height: 100%; overflow: hidden}
		body { text-align:center; }
		input#pickCard { padding:2em; width:100%; height:8em; }		
		div#card { /*width:304px; height:466px;*/ height: 28em; top: 4em; }
		div#card img { width: 100%; }
		div#cards-remaining { position: relative; bottom: -6em; }
		div.cards { display:inline-block; padding:0.4em; }
		.dim { opacity: 0.25; }
		/* iPhone 5 Landscape */
		@media screen and (min-width: 550px) {
			div#card { float: left; width: 15em; height: 19em; }
			div#card img { height: 100%; width: auto; }
			div#cards-remaining img { width: 5em; }
		}
		/* iPhone 6 Portrait */
		@media screen and (min-width: 321px) and (min-height: 321px) {
			div#card {
			    height: 36em;
			}
			div#cards-remaining img { width: 2.5em; }
		}
		/* iPhone 6 Landscape */
		@media screen and (min-width: 600px) {
			div#card {
			    height: 22em;
			}
			div#cards-remaining {
			    width: 35em;
			    padding-top: 4em;
			    padding-left: 4em;
			}
			div#cards-remaining img { width: 4.5em; }
		}
	</style>
</head>
<body>
	<div id="page">
		<div id="card">
			<div class="front"><img src="cards/0.jpg"></div>
			<div class="back"></div>
		</div>
		<div id="cards-remaining"></div>
	</div>
	<script>
		var cards = ['9','10','J','Q','K','A'];
		Array.prototype.pickCard = function(){
			var ri = Math.floor(Math.random() * this.length);
			var rs = this.splice(ri, 1);
			return rs;
		}
		Array.prototype.cheat = function(x){
			var card = cards.indexOf(x);
			this.splice(card, 1);
			return card;
		}
		
		function pickCard() {
			//document.documentElement.webkitRequestFullScreen();
			//screen.orientation.lock("portrait-primary");
			if(cards.length > 0) {
				var card = cards.pickCard();
				$('.back').html('<img src="cards/'+card+'.jpg">');
				$("#card").flip(true);
				$('#'+card).addClass('dim');
			} else {
				$("#card").flip(true);
			}
		}
		
		$(function() {
			$('html, body').on('touchmove', function(e){ 
			     e.preventDefault(); 
			});
			
			$.each(cards, function(idx,card) {
			  $('#cards-remaining').append('<div id="'+card+'" class="cards"><img width="32" src="cards/'+card+'.jpg"></div>');
			});
			
			// Add refresh
			$('#cards-remaining').append('<div id="refresh" class="cards"><img width="32" src="cards/0.jpg"></div>');
			
			$('#refresh').click(function() {
				location.reload();
			});
			
			$('#card').flip({ trigger: 'manual', speed: 250 });
			
			// Swipes
			$('.front').swipe({
		        swipe:function(event, direction, distance, duration, fingerCount, fingerData) {
		        	pickCard();
		        }
			});
			$('.back').swipe({
		        swipe:function(event, direction, distance, duration, fingerCount, fingerData) {
					$("#card").flip(false);
		        }
			});
			
			// Clicks
			$('.front').click(function(){
				pickCard();
			});
			$('.back').click(function(){
				$("#card").flip(false);
			});	
			
			// Cheat
			$('.cards').click(function(e){
				var id = $(this).attr('id');
				var card = cards.cheat(id);
				$('#'+id).addClass('dim');
			});
		});
	</script>
</body>
</html>
